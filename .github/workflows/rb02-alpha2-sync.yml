name: rb02-alpha2-sync

on:
  push:
    branches:
      - 1.14.0
    paths:
      - .github/workflows/rb02-alpha2-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.14.0
          fetch-depth: 0

      - name: Advance RB02 Alpha-2 ownership and historical reconstruction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          rb01_required = '''\t\tstring oneFourteenAdditions = ReadRequiredRepositoryFile(\n\t\t\t"docs/1.14.0-RB01-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenAdditions\n\t\t\t.Split( '\\n' )\n'''
          both_required = '''\t\tstring oneFourteenRb01Additions = ReadRequiredRepositoryFile(\n\t\t\t"docs/1.14.0-RB01-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tstring oneFourteenRb02Additions = ReadRequiredRepositoryFile(\n\t\t\t"docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenRb01Additions\n\t\t\t.Split( '\\n' )\n\t\t\t.Concat( oneFourteenRb02Additions.Split( '\\n' ) )\n'''
          replace_exact(
              "tests/Icod.TermInfo.Inspection.Tests/src/RE08ReleaseClosureTests.cs",
              rb01_required,
              both_required,
          )

          rb01_plain = '''\t\tstring oneFourteenAdditions = ReadRepositoryFile(\n\t\t\t"docs/1.14.0-RB01-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenAdditions\n\t\t\t.Split( '\\n' )\n'''
          both_plain = '''\t\tstring oneFourteenRb01Additions = ReadRepositoryFile(\n\t\t\t"docs/1.14.0-RB01-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tstring oneFourteenRb02Additions = ReadRepositoryFile(\n\t\t\t"docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenRb01Additions\n\t\t\t.Split( '\\n' )\n\t\t\t.Concat( oneFourteenRb02Additions.Split( '\\n' ) )\n'''
          for path in (
              "tests/Icod.TermInfo.Inspection.Tests/src/PG08ReleaseClosureTests.cs",
              "tests/Icod.TermInfo.Inspection.Tests/src/RL08ReleaseClosureTests.cs",
          ):
              replace_exact(path, rb01_plain, both_plain)

          for path in (
              "tests/Icod.TermInfo.Inspection.Tests/src/RE08ReleaseClosureTests.cs",
              "tests/Icod.TermInfo.Inspection.Tests/src/PG08ReleaseClosureTests.cs",
              "tests/Icod.TermInfo.Inspection.Tests/src/RL08ReleaseClosureTests.cs",
          ):
              replace_exact(
                  path,
                  "\t\tAssert.Equal( 13, approvedOneFourteenTypes.Count );",
                  "\t\tAssert.Equal( 15, approvedOneFourteenTypes.Count );",
              )

          replace_exact(
              "Directory.Build.props",
              "<IcodTermInfoSuiteVersion>1.14.0-Alpha-1</IcodTermInfoSuiteVersion>",
              "<IcodTermInfoSuiteVersion>1.14.0-Alpha-2</IcodTermInfoSuiteVersion>",
          )

          Path("tests/Icod.TermInfo.Inspection.Tests/src/RB01VersionAuthorityTests.cs").write_text('''using Xunit;\n\nnamespace Icod.TermInfo.Inspection.Tests;\n\npublic sealed class RB01VersionAuthorityTests {\n\t[Fact]\n\tpublic void Rb01RecordPreservesAcceptedAlphaOneIdentity() {\n\t\tstring record = File.ReadAllText(\n\t\t\tPath.Combine(\n\t\t\t\tFindRepositoryRoot(),\n\t\t\t\t"docs",\n\t\t\t\t"1.14.0-RB01-CONTRACT-AND-PUBLIC-API-REGRET-GATE.md"\n\t\t\t)\n\t\t);\n\n\t\tAssert.Contains( "1.14.0-Alpha-1", record, StringComparison.Ordinal );\n\t\tAssert.Contains(\n\t\t\t"7f43c4ad27f1858f8648237cbcb26e6808142458",\n\t\t\trecord,\n\t\t\tStringComparison.Ordinal\n\t\t);\n\t\tAssert.Contains( "34862203053", record, StringComparison.Ordinal );\n\t}\n\n\tprivate static string FindRepositoryRoot() {\n\t\tDirectoryInfo? current = new( AppContext.BaseDirectory );\n\t\twhile ( current is not null ) {\n\t\t\tif ( File.Exists( Path.Combine( current.FullName, "Icod.TermInfo.sln" ) ) ) {\n\t\t\t\treturn current.FullName;\n\t\t\t}\n\t\t\tcurrent = current.Parent;\n\t\t}\n\t\tthrow new DirectoryNotFoundException(\n\t\t\t"Could not locate the repository root."\n\t\t);\n\t}\n}\n''', encoding="utf-8", newline="\n")

          Path("tests/Icod.TermInfo.Inspection.Tests/src/RB02VersionAuthorityTests.cs").write_text('''using Xunit;\n\nnamespace Icod.TermInfo.Inspection.Tests;\n\npublic sealed class RB02VersionAuthorityTests {\n\t[Fact]\n\tpublic void CoordinatedVersionIsAlphaTwo() {\n\t\tstring properties = File.ReadAllText(\n\t\t\tPath.Combine(\n\t\t\t\tFindRepositoryRoot(),\n\t\t\t\t"Directory.Build.props"\n\t\t\t)\n\t\t);\n\n\t\tAssert.Contains(\n\t\t\t"<IcodTermInfoSuiteVersion>1.14.0-Alpha-2</IcodTermInfoSuiteVersion>",\n\t\t\tproperties,\n\t\t\tStringComparison.Ordinal\n\t\t);\n\t}\n\n\tprivate static string FindRepositoryRoot() {\n\t\tDirectoryInfo? current = new( AppContext.BaseDirectory );\n\t\twhile ( current is not null ) {\n\t\t\tif ( File.Exists( Path.Combine( current.FullName, "Icod.TermInfo.sln" ) ) ) {\n\t\t\t\treturn current.FullName;\n\t\t\t}\n\t\t\tcurrent = current.Parent;\n\t\t}\n\t\tthrow new DirectoryNotFoundException(\n\t\t\t"Could not locate the repository root."\n\t\t);\n\t}\n}\n''', encoding="utf-8", newline="\n")

          Path("docs/1.14.0-RB02-BACKEND-EVIDENCE-CLASSIFICATION-AND-STATIC-INSPECTION.md").write_text('''# Icod.TermInfo 1.14.0 RB02 — Backend Evidence Classification and Static Inspection\n\n## Scope\n\nRB02 implements deterministic raster-backend availability classification and conservative static `TerminalDescription` inspection on top of the frozen RB01 contract. It does not implement candidate evaluation, lifecycle/placement composition, backend selection, live probing, or protocol execution.\n\n## Baseline and development version\n\nThe accepted baseline is RB01 / `1.14.0-Alpha-1` head:\n\n```text\n7f43c4ad27f1858f8648237cbcb26e6808142458\n```\n\nqualified by workflow #865 / run `34862203053`. RB02 advances coordinated development to `1.14.0-Alpha-2`.\n\n## TDD RED witness\n\nThe RB02 test-only contract head is:\n\n```text\nbea78189224f4a520b9cbd6f81ea5fb0f2f2c8b9\n```\n\nWorkflow #868 / run `34864354434` produced the intended RED witness. Linux restored successfully and Build failed with **0 warnings** only because `RasterBackendClassifier` and `RasterBackendInspector` did not yet exist (`CS0103`) across all three supported Inspection TFMs. No unrelated syntax, analyzer, or historical failure was present in the RED witness.\n\n## Classification contract\n\n`RasterBackendClassifier.Classify(...)` classifies one requested backend at a time. Evidence belonging to any different backend is rejected rather than silently ignored.\n\nEvidence provenance precedence is exactly:\n\n```text\nVerified > Declared > CapabilityDerived\n```\n\nOnly the highest precedence present determines support state:\n\n- positive only => `Supported`;\n- negative only => `Unsupported`;\n- both polarities => `Contradicted`;\n- no evidence => `Unknown`.\n\nLower-precedence evidence never changes a higher-precedence result, but the complete canonical bounded evidence snapshot remains attached to the returned profile for auditability.\n\n## Static inspection contract\n\n`RasterBackendInspector` recognizes exactly one static raster-backend advertisement in RB02:\n\n```text\nextended Boolean capability: Sixel\n```\n\nFor `RasterBackendKind.Sixel`, exact Boolean presence yields one positive `CapabilityDerived` evidence item with source label `Sixel` and source ordinal `0`. Absence remains `Unknown` and does not manufacture negative evidence. A capability named `Sixel` with a non-Boolean value is rejected as invalid authoritative metadata.\n\nRB02 intentionally derives no Kitty Graphics evidence from `TerminalDescription`. Names such as `kitty`, `xterm-kitty`, `WindowsTerminal`, or `xterm-256color`, built-in profile identity, unrelated extensions, and Sixel metadata do not imply Kitty Graphics availability. Kitty therefore remains `Unknown` until stronger caller/runtime evidence exists.\n\n## Behavioral GREEN checkpoint\n\nProduction behavior was introduced by commits:\n\n```text\na40cf70e16203b33314b110b6d850b3906369952  RasterBackendClassifier\ne5981778aa88385ea37460a24273faebc64e8e97  RasterBackendInspector\n```\n\nWorkflow #870 / run `34864737857` proved the implementation boundary: Linux Build succeeded with **0 warnings / 0 errors**, and all 25 RB02 behavioral facts passed. The only Inspection failures were the three historical surface-count tests, each larger by exactly the two new RB02 public types. That evidence established that the remaining work was release accounting rather than classifier/inspector behavior.\n\n## Public API accounting\n\nRB02 adds exactly two reviewed public types, recorded in:\n\n```text\ndocs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt\n```\n\nThe cumulative 1.14 compatibility gate retains the distinct 13-type RB01 ledger and 2-type RB02 ledger, unions them to exactly 15 reviewed `RasterBackend*` types, removes only those blocks from the current manifest, requires the exact frozen whole-1.13 SHA-256, then executes the established historical reconstruction through frozen 1.10.\n\nFrozen 1.11/1.12/1.13 surface tests likewise subtract both reviewed 1.14 ledgers before checking their historical counts. No frozen historical hash or schema is changed.\n\n## Dependency boundary\n\nProduction `Icod.TermInfo.Inspection` remains free of `Icod.Terminal`. RB02 performs no live terminal I/O, protocol probing, Sixel transmission, Kitty Graphics transmission, terminal-name heuristics, backend ranking, or lifecycle/placement inference.\n\n## Qualification\n\nFinal Alpha-2 exact-head qualification is pending. RB02 is not complete until Windows/Linux/macOS Build+Test, Windows PowerShell compatibility reconstruction, coordinated package verification, isolated consumer, installed-tool smokes, and all six archive RIDs are green on one exact head.\n''', encoding="utf-8", newline="\n")
          PY

      - name: Commit synchronized Alpha-2 accounting and remove helper
        shell: bash
        run: |
          rm .github/workflows/rb02-alpha2-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Advance RB02 Alpha-2 release accounting"
          git push origin HEAD:1.14.0
