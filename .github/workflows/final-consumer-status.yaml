name: final-consumer-status

on:
  push:
    branches: [1.10.0]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0
      - name: Update final consumer closure status
        run: python3 .github/scripts/final-consumer-status.py
      - name: Commit final consumer closure status
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/1.10.0-RELEASE-AUDIT.md Icod.TermInfo-1.10.0-Deterministic-Multi-Database-Inspection-Comparison-and-Planning-Automation-Roadmap.md
          git commit -m 'Record validated 1.10 consumer closure'
          git push origin HEAD:1.10.0
