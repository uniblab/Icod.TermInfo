name: re08-stable-promotion

on:
  push:
    branches:
      - 1.13.0

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.13.0
          fetch-depth: 0
      - name: Apply stable promotion
        run: python .github/scripts/re08-stable-promotion.py
      - name: Commit promotion and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props README.md Icod.TermInfo.Inspection/README.md Icod.TermInfo-Post-1.0-Development-Roadmap.md Icod.TermInfo-1.13.0-Persistent-Raster-Runtime-Evidence-Interchange-and-Integration-Roadmap.md docs/1.13.0-RELEASE-AUDIT.md tests/Icod.TermInfo.Inspection.Tests/src/RE08ReleaseClosureTests.cs
          git rm .github/scripts/re08-stable-promotion.py .github/workflows/re08-stable-promotion.yml
          git diff --cached --check
          git commit -m "Promote Icod.TermInfo 1.13.0 stable candidate"
          git push origin HEAD:1.13.0
