name: re08-stable-promotion

on:
  push:
    branches:
      - 1.13.0

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.13.0
          fetch-depth: 0
      - name: Apply exact stable-promotion edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact(
              'Directory.Build.props',
              '<IcodTermInfoSuiteVersion>1.13.0-Alpha-8</IcodTermInfoSuiteVersion>',
              '<IcodTermInfoSuiteVersion>1.13.0</IcodTermInfoSuiteVersion>'
          )

          re08 = 'tests/Icod.TermInfo.Inspection.Tests/src/RE08ReleaseClosureTests.cs'
          replace_exact(
              re08,
              'public void AlphaEightReleaseDocumentationIsCompleteWithoutPrematureStablePromotion()',
              'public void ReleaseDocumentationDescribesStableOneThirteen()'
          )
          replace_exact(
              re08,
              '<IcodTermInfoSuiteVersion>1.13.0-Alpha-8</IcodTermInfoSuiteVersion>',
              '<IcodTermInfoSuiteVersion>1.13.0</IcodTermInfoSuiteVersion>'
          )
          replace_exact(
              re08,
              'dotnet add package Icod.TermInfo.Inspection --version 1.12.0',
              'dotnet add package Icod.TermInfo.Inspection --version 1.13.0'
          )

          readme = 'README.md'
          replace_exact(
              readme,
              '''Version `1.12.0` is the current stable coordinated release. It adds
protocol-neutral advanced persistent-raster placement evidence, classification,
lifecycle-aware planning, description/database-set composition, and additive
version-4 profile/plan JSON through `Icod.TermInfo.Inspection` while preserving
the frozen 1.11 lifecycle surface and version-1/version-2/version-3 JSON
contracts.''',
              '''Version `1.13.0` is the coordinated stable-promotion candidate. It
promotes the validated Alpha-8 persistent-raster runtime-evidence interchange
surface without changing feature semantics, public API, schemas, dependencies,
target frameworks, command behavior, package-consumer topology, or archive RIDs.
Stable `1.12.0` remains the published release until merge and tag publication.'''
          )
          replace_exact(readme, '## 1.13 release-candidate status', '## 1.13 stable-promotion status')
          replace_exact(
              readme,
              '''Version `1.13.0-Alpha-8` is the release-hardening candidate for the additive
`Icod.TermInfo.Inspection` runtime-evidence interchange layer. Version 1.13 adds
bounded immutable `PersistentRasterRuntime*` observations, deterministic
atomic-per-family conversion of conclusive observations into existing `Verified`
evidence, audit-visible inconclusive observations and integration issues,
planner-delegating replanning conveniences, and additive version-5 JSON for
runtime observation sets and integration results.''',
              '''Version `1.13.0` promotes the fully validated `1.13.0-Alpha-8` contract
without feature, public API, schema, dependency, target-framework,
command-semantic, package-consumer-topology, or archive-RID changes. The additive
`Icod.TermInfo.Inspection` runtime-evidence interchange layer provides bounded
immutable `PersistentRasterRuntime*` observations, deterministic atomic-per-family
conversion of conclusive observations into existing `Verified` evidence,
audit-visible inconclusive observations and integration issues, planner-delegating
replanning conveniences, and additive version-5 JSON for runtime observation sets
and integration results.'''
          )
          replace_exact(
              readme,
              '''Stable `1.12.0` remains the published release while Alpha-8 is being qualified,
so the install commands below intentionally remain at `1.12.0`. See''',
              '''The Alpha-8 contract was accepted on exact product head
`f236c33d8239e80379bf8cf0f1123abd6c93c3cb` by qualification run `34797445315`,
with all 12 jobs green. Stable `1.13.0` promotion now requires its own fresh full
validation; publication remains gated by merge to `main` and the normal immutable
tag workflow. The install commands below now target `1.13.0`. See'''
          )
          for package in [
              'Icod.TermInfo',
              'Icod.TermInfo.Source',
              'Icod.TermInfo.Termcap',
              'Icod.TermInfo.Compiler',
              'Icod.TermInfo.Inspection',
          ]:
              replace_exact(
                  readme,
                  f'dotnet add package {package} --version 1.12.0',
                  f'dotnet add package {package} --version 1.13.0'
              )
          replace_exact(
              readme,
              'dotnet tool install --global Icod.TermInfo.Tools --version 1.12.0',
              'dotnet tool install --global Icod.TermInfo.Tools --version 1.13.0'
          )
          replace_exact(
              readme,
              '''Historical release contracts remain recorded in the versioned release
audits; the current stable publication contract is recorded in
`docs/1.12.0-RELEASE-AUDIT.md`.''',
              '''Historical release contracts remain recorded in the versioned release
audits; the 1.13 promotion and release contract is recorded in
`docs/1.13.0-RELEASE-AUDIT.md`.'''
          )
          replace_exact(readme, 'Each 1.12.0 archive contains', 'Each 1.13.0 archive contains')
          replace_exact(
              readme,
              '''Version 1.12 adds protocol-neutral source-rectangle and signed-z-order placement semantics and planning while keeping concrete execution values and live protocol work downstream. PTYs, terminal emulation, and graphics protocol execution remain separate later or sibling work.''',
              '''Version 1.12 adds protocol-neutral source-rectangle and signed-z-order placement semantics and planning while keeping concrete execution values and live protocol work downstream. Version 1.13 adds protocol-neutral caller-owned runtime observations, deterministic integration into existing verified evidence, and runtime-evidence audit JSON while keeping live verification downstream. PTYs, terminal emulation, and graphics protocol execution remain separate later or sibling work.'''
          )

          inspection_readme = 'Icod.TermInfo.Inspection/README.md'
          replace_exact(
              inspection_readme,
              '## 1.13 Alpha-8 release candidate',
              '## 1.13 stable-promotion status'
          )
          replace_exact(
              inspection_readme,
              '''`1.13.0-Alpha-8` freezes the additive `PersistentRasterRuntime*` interchange
contract. Caller-owned lifecycle and placement runtime observations are immutable,
bounded, canonical, and protocol-neutral. Conclusive observations integrate as
existing `Verified` evidence through the frozen classifiers; inconclusive
observations remain audit-visible, and represented family capacity/ordinal
limitations fail atomically per family.''',
              '''`1.13.0` promotes the validated Alpha-8 additive
`PersistentRasterRuntime*` interchange contract without semantic, public-API,
schema, dependency, target-framework, or command changes. Caller-owned lifecycle
and placement runtime observations are immutable, bounded, canonical, and
protocol-neutral. Conclusive observations integrate as existing `Verified`
evidence through the frozen classifiers; inconclusive observations remain
audit-visible, and represented family capacity/ordinal limitations fail atomically
per family.'''
          )
          replace_exact(
              inspection_readme,
              'The whole candidate Inspection reflection manifest contains 90',
              'The whole 1.13 Inspection reflection manifest contains 90'
          )
          replace_exact(
              inspection_readme,
              '''fresh Inspection package on net8.0, net9.0, and net10.0. See''',
              '''fresh Inspection package on net8.0, net9.0, and net10.0. Exact Alpha-8
product head `f236c33d8239e80379bf8cf0f1123abd6c93c3cb` passed qualification run
`34797445315` across all 12 jobs. Stable promotion is now undergoing its own
fresh full validation. See'''
          )

          roadmap = 'Icod.TermInfo-Post-1.0-Development-Roadmap.md'
          replace_exact(
              roadmap,
              '**Current coordinated version:** `1.13.0-Alpha-8`',
              '**Current coordinated version:** `1.13.0`'
          )
          replace_exact(
              roadmap,
              '**Next development line:** `1.13.0`',
              '**Next development line:** `TBD`'
          )
          replace_exact(
              roadmap,
              '**Status:** RE01-RE07 accepted; RE08 `1.13.0-Alpha-8` release hardening and whole-surface freeze in progress in draft PR #43',
              '**Status:** RE01-RE08 complete; Alpha-8 accepted; stable `1.13.0` promotion validation in progress in draft PR #43'
          )
          replace_exact(
              roadmap,
              '**Latest completed release audit:** `docs/1.12.0-RELEASE-AUDIT.md`',
              '**Latest completed release audit:** `docs/1.13.0-RELEASE-AUDIT.md`'
          )

          release_roadmap = 'Icod.TermInfo-1.13.0-Persistent-Raster-Runtime-Evidence-Interchange-and-Integration-Roadmap.md'
          replace_exact(
              release_roadmap,
              '**Status:** Planning approved; implementation not yet started  ',
              '**Status:** RE01-RE08 complete; Alpha-8 accepted; stable `1.13.0` promotion validation in progress  '
          )

          audit = 'docs/1.13.0-RELEASE-AUDIT.md'
          replace_exact(
              audit,
              '''RE08 prepares coordinated release candidate `1.13.0-Alpha-8`. Stable promotion remains a separate, verification-gated transition.''',
              '''RE08 completed and exact `1.13.0-Alpha-8` was accepted. Coordinated stable `1.13.0` is now the promotion candidate and remains subject to a fresh full verification gate before release readiness.'''
          )
          replace_exact(
              audit,
              '''## Alpha-8 acceptance gate

`1.13.0-Alpha-8` is accepted only after its exact head passes the complete ordinary pull-request matrix, including all 12 jobs and package/sample/schema/API checks. The accepted workflow/head will be recorded here after that gate completes.

## Stable promotion rule''',
              '''## Alpha-8 acceptance

Exact Alpha-8 product head:

```text
f236c33d8239e80379bf8cf0f1123abd6c93c3cb
```

passed exact-head qualification run `34797445315` with all 12 ordinary pull-request-equivalent jobs green. The qualification workflow pinned every checkout to that exact product head because a stale cancelled PR-run concurrency slot prevented the ordinary workflow from acquiring a runner. The matrix itself was unchanged in substance: Windows/Linux/macOS Build+Test, Windows whole-1.13 plus reconstructed historical Inspection compatibility, coordinated package verification, the isolated DA07 consumer, all three installed-tool smokes, and all six archive RID smokes.

The Windows verifier proved exact whole-surface 1.13 SHA-256 `fd827a25abafb8e9ff3915567f45f9f2ec51b332bfd8a82dd4e4bca20290e764`, then reconstructed exact 1.12 SHA-256 `f71501dcd27a530051c1a02083325144ced2b6173b6b967b9571c620815198f0`, exact 1.11 SHA-256 `69c7350d5d44d502ecf1698c8fe1c1336f03d38eb1a36e36219f50ac33585a86`, and the frozen 1.10 baseline.

## Stable promotion candidate

Stable promotion changes coordinated version identity from `1.13.0-Alpha-8` to `1.13.0` and updates current-facing release documentation/tests only. It introduces no feature semantics, public API, schema, production dependency, target-framework, command, package-consumer-topology, or archive-RID change. A fresh complete matrix is required before stable `1.13.0` may be called release-ready.

## Stable promotion rule'''
          )
          PY
      - name: Commit stable promotion and remove helper
        shell: bash
        run: |
          rm .github/workflows/re08-stable-promotion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Promote Icod.TermInfo 1.13.0 stable candidate'
          git push origin HEAD:1.13.0
