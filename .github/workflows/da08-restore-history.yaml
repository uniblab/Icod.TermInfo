name: da08-restore-history

on:
  push:
    branches: [1.10.0]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0
      - name: Restore historical verifier markers
        run: python3 .github/scripts/da08-restore-history.py
      - name: Commit verifier evidence restoration
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/verify-release-package.sh .github/scripts/verify-release-package.cmd
          git commit -m 'Retain historical Inspection baseline evidence'
          git push origin HEAD:1.10.0
