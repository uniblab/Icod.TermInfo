name: re08-pg08-test-ownership

on:
  push:
    branches:
      - 1.13.0

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.13.0
          fetch-depth: 0
      - name: Correct historical PG08 metadata ownership
        run: python .github/scripts/re08-pg08-test-ownership.py
      - name: Commit correction and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Icod.TermInfo.Inspection.Tests/src/PG08ReleaseClosureTests.cs
          git rm .github/scripts/re08-pg08-test-ownership.py .github/workflows/re08-pg08-test-ownership.yml
          git commit -m "Correct PG08 historical metadata ownership"
          git push origin HEAD:1.13.0
