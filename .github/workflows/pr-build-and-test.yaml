name: pr-build-and-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet clean Icod.TermInfo.sln -c Staging
      - run: dotnet restore Icod.TermInfo.sln
      - run: dotnet build Icod.TermInfo.sln -c Staging --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.TermInfo.sln -c Staging --no-build --logger trx

      - name: Pack Staging packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack Icod.TermInfo.csproj -c Staging --no-build --output artifacts
          dotnet pack Icod.TermInfo.Source/Icod.TermInfo.Source.csproj -c Staging --no-build --output artifacts
          dotnet pack Icod.TermInfo.Compiler/Icod.TermInfo.Compiler.csproj -c Staging --no-build --output artifacts
          dotnet pack Icod.TermInfo.Inspection/Icod.TermInfo.Inspection.csproj -c Staging --no-build --output artifacts

      - name: Verify Staging packages
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/verify-release-package.sh artifacts Staging

      - name: Upload validated Staging packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: icod-terminfo-pr-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
