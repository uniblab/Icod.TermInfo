name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Icod.TermInfo.sln
      - name: Build Debug
        run: dotnet build Icod.TermInfo.sln -c Debug --no-restore
      - name: Test Debug
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build
      - name: Build Release
        run: dotnet build Icod.TermInfo.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test Icod.TermInfo.sln -c Release --no-build

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Icod.TermInfo.csproj
      - name: Pack and validate
        run: dotnet pack Icod.TermInfo.csproj -c Release --no-restore --output artifacts
      - name: T10 package and fresh-consumer verification
        shell: bash
        run: .github/scripts/verify-release-package.sh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg
