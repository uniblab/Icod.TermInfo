name: main release build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Clean
        run: dotnet clean Icod.TermInfo.sln -c Release

      - name: Restore
        run: dotnet restore Icod.TermInfo.sln

      - name: Build Release
        run: dotnet build Icod.TermInfo.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test Icod.TermInfo.sln -c Release --no-build --logger trx
