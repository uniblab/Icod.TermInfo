name: main validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet clean Icod.TermInfo.sln -c Release
      - run: dotnet restore Icod.TermInfo.sln
      - run: dotnet build Icod.TermInfo.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.TermInfo.sln -c Release --no-build --logger trx

      - name: Pack Release packages
        run: |
          dotnet pack Icod.TermInfo.csproj -c Release --no-build --output artifacts
          dotnet pack Icod.TermInfo.Source/Icod.TermInfo.Source.csproj -c Release --no-build --output artifacts
          dotnet pack Icod.TermInfo.Compiler/Icod.TermInfo.Compiler.csproj -c Release --no-build --output artifacts
          dotnet pack Icod.TermInfo.Inspection/Icod.TermInfo.Inspection.csproj -c Release --no-build --output artifacts

      - name: Verify Release packages on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: .github\scripts\verify-release-package.cmd artifacts Release

      - name: Verify Release packages on POSIX
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash .github/scripts/verify-release-package.sh artifacts Release

      - name: Build T10 tool-suite archives
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash .github/scripts/build-tool-archives.sh Release artifacts/tools

      - name: Upload validated Release packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: icod-terminfo-main-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated T10 tool-suite archives
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: icod-terminfo-main-tools
          path: artifacts/tools/*
          if-no-files-found: error
          retention-days: 7
