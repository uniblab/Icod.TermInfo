name: build and validate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet clean Icod.TermInfo.sln -c ${{ matrix.configuration }}
      - run: dotnet restore Icod.TermInfo.sln
      - run: dotnet build Icod.TermInfo.sln -c ${{ matrix.configuration }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.TermInfo.sln -c ${{ matrix.configuration }} --no-build --logger trx

  package-validation:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Icod.TermInfo.sln
      - run: dotnet build Icod.TermInfo.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.TermInfo.sln -c Release --no-build --logger trx
      - run: dotnet pack Icod.TermInfo.csproj -c Release --no-build --output artifacts
      - run: bash .github/scripts/verify-release-package.sh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: icod-terminfo-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
