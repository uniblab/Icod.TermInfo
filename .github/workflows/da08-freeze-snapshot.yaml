name: da08-freeze-snapshot

on:
  push:
    branches: [1.10.0]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build
        run: |
          dotnet restore Icod.TermInfo.sln
          dotnet build Icod.TermInfo.sln -c Staging --no-restore -p:ContinuousIntegrationBuild=true
      - name: Snapshot
        run: |
          dotnet run --project tools/public-api-snapshot/Icod.TermInfo.PublicApiSnapshot.csproj -c Staging --no-build -- --write docs/1.10.0-INSPECTION-PUBLIC-API-BASELINE.txt Icod.TermInfo.Inspection/bin/Staging/net10.0/Icod.TermInfo.Inspection.dll
          dotnet run --project tools/public-api-snapshot/Icod.TermInfo.PublicApiSnapshot.csproj -c Staging --no-build -- --check docs/1.10.0-INSPECTION-PUBLIC-API-BASELINE.txt Icod.TermInfo.Inspection/bin/Staging/net8.0/Icod.TermInfo.Inspection.dll
          dotnet run --project tools/public-api-snapshot/Icod.TermInfo.PublicApiSnapshot.csproj -c Staging --no-build -- --check docs/1.10.0-INSPECTION-PUBLIC-API-BASELINE.txt Icod.TermInfo.Inspection/bin/Staging/net9.0/Icod.TermInfo.Inspection.dll
          api_hash="$(sha256sum docs/1.10.0-INSPECTION-PUBLIC-API-BASELINE.txt | awk '{print $1}')"
          v1_hash="$(sha256sum docs/Icod.TermInfo.Inspection.schema.json | awk '{print $1}')"
          v2_hash="$(sha256sum docs/Icod.TermInfo.Inspection.schema.v2.json | awk '{print $1}')"
          printf 'Icod.TermInfo 1.10.0 DA08 freeze fingerprints\nInspection API SHA-256: %s\nJSON v1 schema SHA-256: %s\nJSON v2 schema SHA-256: %s\n' "$api_hash" "$v1_hash" "$v2_hash" > docs/1.10.0-DA08-FREEZE-FINGERPRINTS.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/1.10.0-INSPECTION-PUBLIC-API-BASELINE.txt docs/1.10.0-DA08-FREEZE-FINGERPRINTS.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Freeze DA08 Inspection API and schema fingerprints'
          git push origin HEAD:1.10.0
