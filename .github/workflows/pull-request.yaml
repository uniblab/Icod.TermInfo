name: pull-request

on:
  pull_request:

permissions:
  contents: write

jobs:
  re01-compatibility-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded RE01 compatibility update
        run: python .github/scripts/apply-re01-compat.py
      - name: Commit compatibility update if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "RE01 compatibility handoff already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/verify-inspection-compatibility.ps1
          git commit -m "Teach compatibility verifier about 1.13 additions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
