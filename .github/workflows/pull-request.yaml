name: pull-request

on:
  pull_request:

permissions:
  contents: write

jobs:
  re01-test-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded RE01 test ownership correction
        run: python .github/scripts/apply-re01-test-ownership.py
      - name: Commit correction if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "RE01 test ownership correction already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Make historical release tests additive-development aware"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
