name: Apply DA03 semantic analysis

on:
  push:
    branches:
      - 1.10.0
    paths:
      - .github/workflows/da03-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Correct unit-test cancellation tokens
        run: sed -i 's/TestContext.Current.CancellationToken/CancellationToken.None/g' .github/scripts/da03-apply.py

      - name: Refine incomplete alias visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/da03-apply.py')
          text = path.read_text(encoding='utf-8')
          old = '''\t\t\tif ( pair.Value.Count < 2\n\t\t\t\t&& matchingCanonicalIdentity is null ) {\n\t\t\t\tcontinue;\n\t\t\t}'''
          new = '''\t\t\tif ( pair.Value.Count < 2\n\t\t\t\t&& matchingCanonicalIdentity is null\n\t\t\t\t&& IsComplete ) {\n\t\t\t\tcontinue;\n\t\t\t}'''
          if text.count(old) != 1:
              raise SystemExit('DA03 alias visibility guard mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Apply DA03 coordinated updates
        run: python3 .github/scripts/da03-apply.py

      - name: Build DA03
        run: dotnet build Icod.TermInfo.sln -c Debug

      - name: Test DA03
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build

      - name: Commit DA03
        run: |
          rm .github/scripts/da03-apply.py
          rm .github/workflows/da03-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement DA03 semantic analysis"
          git push origin HEAD:1.10.0
