name: Apply DA02 precedence

on:
  push:
    branches:
      - 1.10.0
    paths:
      - .github/workflows/da02-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Correct historical-version guard
        run: sed -i '/MI07ReleaseClosureTests.cs/d' .github/scripts/da02-apply.py

      - name: Apply DA02 coordinated updates
        run: python3 .github/scripts/da02-apply.py

      - name: Build DA02
        run: dotnet build Icod.TermInfo.sln -c Debug

      - name: Test DA02
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build

      - name: Commit DA02
        run: |
          rm .github/scripts/da02-apply.py
          rm .github/workflows/da02-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement DA02 deterministic precedence"
          git push origin HEAD:1.10.0
