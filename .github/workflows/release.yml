name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Icod.TermInfo.sln

      - name: Build Release
        run: dotnet build Icod.TermInfo.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test Icod.TermInfo.sln -c Release --no-build --logger trx

  pack:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' Icod.TermInfo.csproj | head -n 1)"
          test -n "${version}"

          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match PackageVersion '${version}'." >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore Icod.TermInfo.sln

      - name: Build Release
        run: dotnet build Icod.TermInfo.sln -c Release --no-restore

      - name: Pack once for all feeds
        run: dotnet pack Icod.TermInfo.csproj -c Release --no-build --output artifacts

      - name: T10 package and fresh-consumer verification
        shell: bash
        run: .github/scripts/verify-release-package.sh artifacts

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download release package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push artifacts/Icod.TermInfo.*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: bash
        run: |
          dotnet nuget push artifacts/Icod.TermInfo.*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --symbol-source "https://api.nuget.org/v3/index.json" \
            --symbol-api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.nupkg \
            artifacts/*.snupkg \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
