name: re08-documentation-closure

on:
  push:
    branches:
      - 1.13.0

permissions:
  contents: write

jobs:
  patch-release-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.13.0
          fetch-depth: 0
      - name: Apply exact RE08 documentation insertions
        run: python .github/scripts/re08-doc-closure.py
      - name: Commit closure and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Icod.TermInfo.Inspection/README.md docs/VERSIONING.md docs/COMPATIBILITY.md Icod.TermInfo-Post-1.0-Development-Roadmap.md
          git rm .github/scripts/re08-doc-closure.py .github/workflows/re08-documentation-closure.yml
          git commit -m "Complete RE08 release-facing documentation"
          git push origin HEAD:1.13.0
