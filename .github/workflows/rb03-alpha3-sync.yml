name: rb03-alpha3-sync

on:
  push:
    branches:
      - 1.14.0
    paths:
      - .github/workflows/rb03-alpha3-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.14.0
          fetch-depth: 0

      - name: Advance RB03 Alpha-3 accounting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # Version ownership.
          replace_exact(
              "Directory.Build.props",
              "<IcodTermInfoSuiteVersion>1.14.0-Alpha-2</IcodTermInfoSuiteVersion>",
              "<IcodTermInfoSuiteVersion>1.14.0-Alpha-3</IcodTermInfoSuiteVersion>",
          )

          # RB03 additive surface ledger.
          Path("docs/1.14.0-RB03-INSPECTION-PUBLIC-API-ADDITIONS.txt").write_text(
              "# Icod.TermInfo 1.14.0 RB03 Inspection public API additions\n"
              "Icod.TermInfo.Inspection.RasterBackendPlanner\n",
              encoding="utf-8",
              newline="\n",
          )

          # Cumulative compatibility wrapper: RB01 13 + RB02 2 + RB03 1 = 16.
          path = ".github/scripts/verify-inspection-compatibility.ps1"
          replace_exact(
              path,
              "$oneFourteenRb02TypesPath = Join-Path $repositoryRoot 'docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt'\n$historyVerifierPath",
              "$oneFourteenRb02TypesPath = Join-Path $repositoryRoot 'docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt'\n$oneFourteenRb03TypesPath = Join-Path $repositoryRoot 'docs/1.14.0-RB03-INSPECTION-PUBLIC-API-ADDITIONS.txt'\n$historyVerifierPath",
          )
          replace_exact(
              path,
              "    $oneFourteenRb02TypesPath,\n    $historyVerifierPath,",
              "    $oneFourteenRb02TypesPath,\n    $oneFourteenRb03TypesPath,\n    $historyVerifierPath,",
          )
          replace_exact(
              path,
              "        $approvedRb02Types = Read-ApprovedTypes `\n            -Path $oneFourteenRb02TypesPath `\n            -ExpectedCount 2 `\n            -ReleaseLabel '1.14 RB02'\n        $approvedOneFourteenTypes",
              "        $approvedRb02Types = Read-ApprovedTypes `\n            -Path $oneFourteenRb02TypesPath `\n            -ExpectedCount 2 `\n            -ReleaseLabel '1.14 RB02'\n        $approvedRb03Types = Read-ApprovedTypes `\n            -Path $oneFourteenRb03TypesPath `\n            -ExpectedCount 1 `\n            -ReleaseLabel '1.14 RB03'\n        $approvedOneFourteenTypes",
          )
          replace_exact(
              path,
              "        foreach ($approvedType in $approvedRb02Types) {\n            if (-not $approvedOneFourteenTypes.Add($approvedType)) {\n                throw \"Duplicate reviewed 1.14 Inspection public type across tranche ledgers: $approvedType\"\n            }\n        }\n        if ($approvedOneFourteenTypes.Count -ne 15) {\n            throw \"Reviewed 1.14 Inspection public type set must contain exactly 15 types through RB02; found $($approvedOneFourteenTypes.Count).\"\n        }",
              "        foreach ($approvedType in $approvedRb02Types) {\n            if (-not $approvedOneFourteenTypes.Add($approvedType)) {\n                throw \"Duplicate reviewed 1.14 Inspection public type across tranche ledgers: $approvedType\"\n            }\n        }\n        foreach ($approvedType in $approvedRb03Types) {\n            if (-not $approvedOneFourteenTypes.Add($approvedType)) {\n                throw \"Duplicate reviewed 1.14 Inspection public type across tranche ledgers: $approvedType\"\n            }\n        }\n        if ($approvedOneFourteenTypes.Count -ne 16) {\n            throw \"Reviewed 1.14 Inspection public type set must contain exactly 16 types through RB03; found $($approvedOneFourteenTypes.Count).\"\n        }",
          )
          replace_exact(
              path,
              '            "Verified exact 1.13 Inspection public API SHA-256 {0} after excluding {1} approved 1.14 type block(s): {2} RB01 and {3} RB02." -f `\n                $oneThirteenCandidateSha256, `\n                $oneThirteenCandidate.RemovedTypeCount, `\n                $approvedRb01Types.Count, `\n                $approvedRb02Types.Count',
              '            "Verified exact 1.13 Inspection public API SHA-256 {0} after excluding {1} approved 1.14 type block(s): {2} RB01, {3} RB02, and {4} RB03." -f `\n                $oneThirteenCandidateSha256, `\n                $oneThirteenCandidate.RemovedTypeCount, `\n                $approvedRb01Types.Count, `\n                $approvedRb02Types.Count, `\n                $approvedRb03Types.Count',
          )

          # Historical release tests subtract all three reviewed 1.14 ledgers.
          rb02_required = '''\t\tstring oneFourteenRb02Additions = ReadRequiredRepositoryFile(\n\t\t\t"docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenRb01Additions\n\t\t\t.Split( '\\n' )\n\t\t\t.Concat( oneFourteenRb02Additions.Split( '\\n' ) )\n'''
          rb03_required = '''\t\tstring oneFourteenRb02Additions = ReadRequiredRepositoryFile(\n\t\t\t"docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tstring oneFourteenRb03Additions = ReadRequiredRepositoryFile(\n\t\t\t"docs/1.14.0-RB03-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenRb01Additions\n\t\t\t.Split( '\\n' )\n\t\t\t.Concat( oneFourteenRb02Additions.Split( '\\n' ) )\n\t\t\t.Concat( oneFourteenRb03Additions.Split( '\\n' ) )\n'''
          replace_exact(
              "tests/Icod.TermInfo.Inspection.Tests/src/RE08ReleaseClosureTests.cs",
              rb02_required,
              rb03_required,
          )

          rb02_plain = '''\t\tstring oneFourteenRb02Additions = ReadRepositoryFile(\n\t\t\t"docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenRb01Additions\n\t\t\t.Split( '\\n' )\n\t\t\t.Concat( oneFourteenRb02Additions.Split( '\\n' ) )\n'''
          rb03_plain = '''\t\tstring oneFourteenRb02Additions = ReadRepositoryFile(\n\t\t\t"docs/1.14.0-RB02-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tstring oneFourteenRb03Additions = ReadRepositoryFile(\n\t\t\t"docs/1.14.0-RB03-INSPECTION-PUBLIC-API-ADDITIONS.txt"\n\t\t);\n\t\tHashSet<string> approvedOneFourteenTypes = oneFourteenRb01Additions\n\t\t\t.Split( '\\n' )\n\t\t\t.Concat( oneFourteenRb02Additions.Split( '\\n' ) )\n\t\t\t.Concat( oneFourteenRb03Additions.Split( '\\n' ) )\n'''
          for test_path in (
              "tests/Icod.TermInfo.Inspection.Tests/src/PG08ReleaseClosureTests.cs",
              "tests/Icod.TermInfo.Inspection.Tests/src/RL08ReleaseClosureTests.cs",
          ):
              replace_exact(test_path, rb02_plain, rb03_plain)

          for test_path in (
              "tests/Icod.TermInfo.Inspection.Tests/src/RE08ReleaseClosureTests.cs",
              "tests/Icod.TermInfo.Inspection.Tests/src/PG08ReleaseClosureTests.cs",
              "tests/Icod.TermInfo.Inspection.Tests/src/RL08ReleaseClosureTests.cs",
          ):
              replace_exact(
                  test_path,
                  "\t\tAssert.Equal( 15, approvedOneFourteenTypes.Count );",
                  "\t\tAssert.Equal( 16, approvedOneFourteenTypes.Count );",
              )

          # Freeze RB02 as historical accepted checkpoint.
          Path("tests/Icod.TermInfo.Inspection.Tests/src/RB02VersionAuthorityTests.cs").write_text('''using Xunit;\n\nnamespace Icod.TermInfo.Inspection.Tests;\n\npublic sealed class RB02VersionAuthorityTests {\n\t[Fact]\n\tpublic void Rb02RecordPreservesAcceptedAlphaTwoIdentity() {\n\t\tstring record = File.ReadAllText(\n\t\t\tPath.Combine(\n\t\t\t\tFindRepositoryRoot(),\n\t\t\t\t"docs",\n\t\t\t\t"1.14.0-RB02-BACKEND-EVIDENCE-CLASSIFICATION-AND-STATIC-INSPECTION.md"\n\t\t\t)\n\t\t);\n\n\t\tAssert.Contains( "1.14.0-Alpha-2", record, StringComparison.Ordinal );\n\t\tAssert.Contains(\n\t\t\t"6321de472a6e54a8382dd214996c22a4cf62e816",\n\t\t\trecord,\n\t\t\tStringComparison.Ordinal\n\t\t);\n\t\tAssert.Contains( "34865731077", record, StringComparison.Ordinal );\n\t}\n\n\tprivate static string FindRepositoryRoot() {\n\t\tDirectoryInfo? current = new( AppContext.BaseDirectory );\n\t\twhile ( current is not null ) {\n\t\t\tif ( File.Exists( Path.Combine( current.FullName, "Icod.TermInfo.sln" ) ) ) {\n\t\t\t\treturn current.FullName;\n\t\t\t}\n\t\t\tcurrent = current.Parent;\n\t\t}\n\t\tthrow new DirectoryNotFoundException(\n\t\t\t"Could not locate the repository root."\n\t\t);\n\t}\n}\n''', encoding="utf-8", newline="\n")

          Path("tests/Icod.TermInfo.Inspection.Tests/src/RB03VersionAuthorityTests.cs").write_text('''using Xunit;\n\nnamespace Icod.TermInfo.Inspection.Tests;\n\npublic sealed class RB03VersionAuthorityTests {\n\t[Fact]\n\tpublic void CoordinatedVersionIsAlphaThree() {\n\t\tstring properties = File.ReadAllText(\n\t\t\tPath.Combine(\n\t\t\t\tFindRepositoryRoot(),\n\t\t\t\t"Directory.Build.props"\n\t\t\t)\n\t\t);\n\n\t\tAssert.Contains(\n\t\t\t"<IcodTermInfoSuiteVersion>1.14.0-Alpha-3</IcodTermInfoSuiteVersion>",\n\t\t\tproperties,\n\t\t\tStringComparison.Ordinal\n\t\t);\n\t}\n\n\tprivate static string FindRepositoryRoot() {\n\t\tDirectoryInfo? current = new( AppContext.BaseDirectory );\n\t\twhile ( current is not null ) {\n\t\t\tif ( File.Exists( Path.Combine( current.FullName, "Icod.TermInfo.sln" ) ) ) {\n\t\t\t\treturn current.FullName;\n\t\t\t}\n\t\t\tcurrent = current.Parent;\n\t\t}\n\t\tthrow new DirectoryNotFoundException(\n\t\t\t"Could not locate the repository root."\n\t\t);\n\t}\n}\n''', encoding="utf-8", newline="\n")

          Path("docs/1.14.0-RB03-CANDIDATE-EVALUATION.md").write_text('''# Icod.TermInfo 1.14.0 RB03 — Backend Candidate Evaluation\n\n## Scope\n\nRB03 adds single-candidate raster-backend evaluation by composing the already-classified backend availability profile with the frozen 1.11 lifecycle planner and, when requested, the frozen 1.12 placement planner. It does not perform multi-candidate selection or preference resolution; those remain RB04.\n\n## Accepted baseline\n\nRB03 begins from accepted RB02 / `1.14.0-Alpha-2` exact head:\n\n```text\n6321de472a6e54a8382dd214996c22a4cf62e816\n```\n\nqualified by workflow #875 / run `34865731077`.\n\n## TDD RED witness\n\nThe tests-only RB03 contract head is:\n\n```text\n1761943f5e8244b3cccb457cb4c1479e9d92c254\n```\n\nWorkflow #878 / run `34867194184` produced the intended RED witness. Linux Restore succeeded and Build failed with **0 warnings** only because `RasterBackendPlanner` did not yet exist (`CS0103`) across net8/net9/net10. No helper signature, frozen planner, syntax, or analyzer defect was present.\n\n## Evaluator contract\n\nRB03 adds exactly one behavior owner:\n\n```csharp\nRasterBackendPlanner.Evaluate(\n    RasterBackendCandidate candidate,\n    RasterBackendSelectionRequest request\n)\n```\n\nThe evaluator always delegates lifecycle semantics to `PersistentRasterLifecyclePlanner`. When a placement request is present, it always delegates placement semantics to `PersistentRasterPlacementPlanner`. The resulting plans are retained in `RasterBackendCandidateEvaluation` even when backend availability itself determines the final candidate status.\n\nBackend availability has final-status precedence exactly as approved:\n\n- `Unsupported` => `Impossible`;\n- `Unknown` or `Contradicted` => `RequiresRuntimeVerification`;\n- `Supported` => status derives from the frozen lifecycle/placement plans.\n\nFor a supported backend, lifecycle `Impossible` => candidate `Impossible`; lifecycle `Indeterminate` => runtime verification; lifecycle `Success` with no placement request => `Satisfied`; otherwise placement `Impossible` => candidate `Impossible`, placement `RequiresRuntimeVerification`/`Indeterminate` => runtime verification, and placement `Satisfied` => candidate `Satisfied`.\n\nNo Sixel/Kitty-specific lifecycle or placement rule exists in the evaluator. Backend identity is carried only as candidate identity.\n\n## Behavioral GREEN checkpoint\n\nMinimum production implementation commit:\n\n```text\n779c8d44a1eac31586658f3d40f4548d7de2452f\n```\n\nWorkflow #879 / run `34867526088` proved the behavior/accounting boundary: macOS Build succeeded with **0 warnings / 0 errors**, all RB03 candidate-evaluation facts passed, and the only Inspection failures were the three frozen historical surface-count tests, each larger by exactly one newly exported `RasterBackendPlanner` type (`90 -> 91`, `81 -> 82`, `67 -> 68`). No RB03 behavioral test failed.\n\n## Public API accounting\n\nRB03 adds exactly one reviewed public type:\n\n```text\nIcod.TermInfo.Inspection.RasterBackendPlanner\n```\n\nrecorded in `docs/1.14.0-RB03-INSPECTION-PUBLIC-API-ADDITIONS.txt`. The cumulative compatibility gate keeps RB01, RB02, and RB03 ledgers distinct, unions them to exactly 16 reviewed `RasterBackend*` types, removes only those blocks from the current manifest, requires exact frozen 1.13, then executes the historical reconstruction through frozen 1.10.\n\nFrozen 1.11/1.12/1.13 release tests likewise subtract all three 1.14 ledgers. No historical fingerprint or JSON schema changes.\n\n## Version\n\nRB03 advances coordinated development to `1.14.0-Alpha-3`. RB02 remains frozen as the accepted Alpha-2 checkpoint.\n\n## Qualification\n\nFinal Alpha-3 exact-head qualification is pending. RB03 is not complete until the full 12-job Windows/Linux/macOS + package/tool/archive matrix succeeds on one exact head.\n''', encoding="utf-8", newline="\n")
          PY

      - name: Commit synchronized Alpha-3 accounting and remove helper
        shell: bash
        run: |
          rm .github/workflows/rb03-alpha3-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Advance RB03 Alpha-3 release accounting"
          git push origin HEAD:1.14.0
