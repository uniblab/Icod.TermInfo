name: publish GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Icod.TermInfo.sln

      - name: Build
        run: dotnet build Icod.TermInfo.sln -c Release --no-restore

      - name: Test
        run: dotnet test Icod.TermInfo.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Icod.TermInfo.csproj -c Release --no-build --output artifacts

      - name: T10 package and fresh-consumer verification
        shell: bash
        run: .github/scripts/verify-release-package.sh artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-packages-${{ github.sha }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push artifacts/Icod.TermInfo.*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
