name: Validate DA03 alias order fix

on:
  push:
    branches:
      - 1.10.0
    paths:
      - .github/workflows/da03-alias-order-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Apply focused alias-order correction
        run: python3 .github/scripts/da03-alias-order-fix.py

      - name: Build corrected DA03
        run: dotnet build Icod.TermInfo.sln -c Debug

      - name: Test corrected DA03
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build

      - name: Commit corrected DA03
        run: |
          rm .github/scripts/da03-alias-order-fix.py
          rm .github/workflows/da03-alias-order-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve DA03 alias precedence order"
          git push origin HEAD:1.10.0
