name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSIONS: |
    8.0.x
    9.0.x
    10.0.x
  CONFIGURATION: Release
  SOLUTION_PATH: Icod.TermInfo.sln

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit in main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit contained in main."
          }
      - id: version
        name: Validate tag and suite version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }
          $tagVersion = $Matches.version
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $node = $props.SelectSingleNode('/Project/PropertyGroup/IcodTermInfoSuiteVersion')
          if ($null -eq $node -or [string]::IsNullOrWhiteSpace($node.InnerText)) {
              throw 'Directory.Build.props must declare IcodTermInfoSuiteVersion.'
          }
          $suiteVersion = $node.InnerText.Trim()
          if ($tagVersion -ne $suiteVersion) {
              throw "Tag version '$tagVersion' does not match suite version '$suiteVersion'."
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}
      - run: dotnet restore ${{ env.SOLUTION_PATH }}
      - run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx
      - name: Pack coordinated Release packages
        shell: pwsh
        run: ./packaging/PackPackages.ps1 -Configuration '${{ env.CONFIGURATION }}' -OutputDirectory artifacts/release
      - name: Verify exact Release package artifacts
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts/release -Configuration '${{ env.CONFIGURATION }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
          if-no-files-found: error
          retention-days: 7

  tool-archives:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and verify Release tool archives
        shell: pwsh
        run: ./packaging/BuildToolArchives.ps1 -Configuration '${{ env.CONFIGURATION }}' -OutputDirectory artifacts/tools
      - uses: actions/upload-artifact@v4
        with:
          name: release-tool-archives
          path: artifacts/tools/*
          if-no-files-found: error
          retention-days: 7

  smoke-tool-package:
    needs: [metadata, package]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - shell: pwsh
        run: ./.github/scripts/smoke-tool-package.ps1 artifacts

  smoke-tool-archives:
    needs: [metadata, tool-archives]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: windows-11-arm
            name: Windows ARM64
          - os: ubuntu-24.04
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: macos-15-intel
            name: macOS x64
          - os: macos-15
            name: macOS ARM64
    name: Archive ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-tool-archives
          path: artifacts/tools
      - shell: pwsh
        run: ./.github/scripts/smoke-tool-archive.ps1 artifacts/tools

  publish-nuget:
    needs: [metadata, package, smoke-tool-package, smoke-tool-archives]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File | Sort-Object Name)
          if (6 -ne $packages.Count) {
              throw "Expected six coordinated .nupkg files; found $($packages.Count)."
          }
          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
              if (0 -ne $LASTEXITCODE) {
                  throw "NuGet.org publication failed for '$($package.Name)' with status $LASTEXITCODE."
              }
          }

  publish-github-packages:
    needs: [metadata, package, smoke-tool-package, smoke-tool-archives]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/package
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          dotnet nuget add source $source --name github-release --username $env:GITHUB_ACTOR_NAME --password $env:GITHUB_TOKEN --store-password-in-clear-text
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Packages source configuration failed with status $LASTEXITCODE."
          }
          $packages = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File | Sort-Object Name)
          if (6 -ne $packages.Count) {
              throw "Expected six coordinated .nupkg files; found $($packages.Count)."
          }
          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --source github-release --api-key $env:GITHUB_TOKEN --skip-duplicate
              if (0 -ne $LASTEXITCODE) {
                  throw "GitHub Packages publication failed for '$($package.Name)' with status $LASTEXITCODE."
              }
          }

  github-release:
    needs: [metadata, package, tool-archives, publish-nuget, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-tool-archives
          path: artifacts/release-assets
      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.nupkg', '.snupkg', '.zip', '.gz') } | Sort-Object Name)
          if (17 -ne $files.Count) {
              throw "Expected seventeen release binaries before checksumming; found $($files.Count)."
          }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $assetDirectory 'SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ needs.metadata.outputs.version }}'
          $assets = @(Get-ChildItem -LiteralPath 'artifacts/release-assets' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if (18 -ne $assets.Count) {
              throw "Expected eighteen GitHub Release assets; found $($assets.Count)."
          }
          $arguments = @('release', 'create', $tag, '--verify-tag', '--title', "${{ github.event.repository.name }} $version", '--generate-notes')
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets
          & gh @arguments
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Release creation failed with status $LASTEXITCODE."
          }
