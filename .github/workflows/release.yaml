name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag on exact main HEAD
        shell: pwsh
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          $mainCommit = (git rev-parse origin/main).Trim()
          if (0 -ne $LASTEXITCODE -or [string]::IsNullOrWhiteSpace($mainCommit)) {
              throw 'Unable to resolve the current origin/main commit.'
          }
          if ($env:GITHUB_SHA -ne $mainCommit) {
              throw "Release tag '$env:GITHUB_REF_NAME' points to '$env:GITHUB_SHA', but the exact current main commit is '$mainCommit'."
          }

      - id: version
        name: Validate tag and centralized suite version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }

          $tagVersion = $Matches.version
          [xml]$buildProperties = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $suiteVersionNode = $buildProperties.SelectSingleNode(
              '/Project/PropertyGroup/IcodTermInfoSuiteVersion'
          )
          if ($null -eq $suiteVersionNode) {
              throw 'Directory.Build.props must declare IcodTermInfoSuiteVersion.'
          }
          $coordinatedVersion = $suiteVersionNode.InnerText
          if ($tagVersion -ne $coordinatedVersion) {
              throw "Tag version '$tagVersion' does not match IcodTermInfoSuiteVersion '$coordinatedVersion'."
          }

          $versionReference = '$(IcodTermInfoSuiteVersion)'
          $libraryProjects = @(
              @{ Name = 'Runtime'; Path = 'Icod.TermInfo.csproj' },
              @{ Name = 'Source'; Path = 'Icod.TermInfo.Source/Icod.TermInfo.Source.csproj' },
              @{ Name = 'Compiler'; Path = 'Icod.TermInfo.Compiler/Icod.TermInfo.Compiler.csproj' },
              @{ Name = 'Inspection'; Path = 'Icod.TermInfo.Inspection/Icod.TermInfo.Inspection.csproj' }
          )
          foreach ($projectInfo in $libraryProjects) {
              [xml]$project = Get-Content -LiteralPath $projectInfo.Path -Raw
              $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
              $packageVersionNode = $project.SelectSingleNode('/Project/PropertyGroup/PackageVersion')
              if (
                  $null -eq $versionNode
                  -or $null -eq $packageVersionNode
                  -or $versionNode.InnerText -ne $versionReference
                  -or $packageVersionNode.InnerText -ne $versionReference
              ) {
                  throw "$($projectInfo.Name) must consume IcodTermInfoSuiteVersion for Version and PackageVersion."
              }
          }

          foreach ($commandPath in @(
              'tic/Icod.TermInfo.Tic.csproj',
              'infocmp/Icod.TermInfo.InfoCmp.csproj',
              'toe/Icod.TermInfo.Toe.csproj'
          )) {
              [xml]$commandProject = Get-Content -LiteralPath $commandPath -Raw
              $commandVersionNode = $commandProject.SelectSingleNode('/Project/PropertyGroup/Version')
              if ($null -eq $commandVersionNode -or $commandVersionNode.InnerText -ne $versionReference) {
                  throw "'$commandPath' must consume IcodTermInfoSuiteVersion for Version."
              }
          }

          [xml]$router = Get-Content -LiteralPath 'icod-terminfo/Icod.TermInfo.Router.csproj' -Raw
          foreach ($propertyName in @('Version', 'PackageVersion')) {
              $node = $router.SelectSingleNode("/Project/PropertyGroup/$propertyName")
              if ($null -eq $node -or $node.InnerText -ne $versionReference) {
                  throw "Router $propertyName must consume IcodTermInfoSuiteVersion."
              }
          }
          $packAsToolNode = $router.SelectSingleNode('/Project/PropertyGroup/PackAsTool')
          $packageIdNode = $router.SelectSingleNode('/Project/PropertyGroup/PackageId')
          $toolCommandNameNode = $router.SelectSingleNode('/Project/PropertyGroup/ToolCommandName')
          if ($null -eq $packAsToolNode -or $packAsToolNode.InnerText -ne 'true') {
              throw 'Router must remain a .NET tool package.'
          }
          if ($null -eq $packageIdNode -or $packageIdNode.InnerText -ne 'Icod.TermInfo.Tools') {
              throw 'Router PackageId must remain Icod.TermInfo.Tools.'
          }
          if ($null -eq $toolCommandNameNode -or $toolCommandNameNode.InnerText -ne 'icod-terminfo') {
              throw 'Router ToolCommandName must remain icod-terminfo.'
          }

          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  validate:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet clean Icod.TermInfo.sln -c Release
      - run: dotnet restore Icod.TermInfo.sln
      - run: dotnet build Icod.TermInfo.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.TermInfo.sln -c Release --no-build --logger trx

      - name: Pack Release packages
        run: |
          dotnet pack Icod.TermInfo.csproj -c Release --no-build --output artifacts
          dotnet pack Icod.TermInfo.Source/Icod.TermInfo.Source.csproj -c Release --no-build --output artifacts
          dotnet pack Icod.TermInfo.Compiler/Icod.TermInfo.Compiler.csproj -c Release --no-build --output artifacts
          dotnet pack Icod.TermInfo.Inspection/Icod.TermInfo.Inspection.csproj -c Release --no-build --output artifacts
          dotnet pack icod-terminfo/Icod.TermInfo.Router.csproj -c Release --no-build --output artifacts

      - name: Verify Release packages on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: .github\scripts\verify-release-package.cmd artifacts Release

      - name: Verify Release packages on POSIX
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash .github/scripts/verify-release-package.sh artifacts Release

      - name: Upload canonical release packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/Icod.TermInfo.${{ needs.metadata.outputs.version }}.nupkg
            artifacts/Icod.TermInfo.${{ needs.metadata.outputs.version }}.snupkg
            artifacts/Icod.TermInfo.Source.${{ needs.metadata.outputs.version }}.nupkg
            artifacts/Icod.TermInfo.Source.${{ needs.metadata.outputs.version }}.snupkg
            artifacts/Icod.TermInfo.Compiler.${{ needs.metadata.outputs.version }}.nupkg
            artifacts/Icod.TermInfo.Compiler.${{ needs.metadata.outputs.version }}.snupkg
            artifacts/Icod.TermInfo.Inspection.${{ needs.metadata.outputs.version }}.nupkg
            artifacts/Icod.TermInfo.Inspection.${{ needs.metadata.outputs.version }}.snupkg
            artifacts/Icod.TermInfo.Tools.${{ needs.metadata.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 7

  tool-archives:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build framework-dependent T10 tool-suite archives
        shell: bash
        run: bash .github/scripts/build-tool-archives.sh Release artifacts/tools

      - name: Verify T11 tool-suite archives
        shell: bash
        run: bash .github/scripts/verify-tool-archives.sh artifacts/tools

      - name: Upload canonical tool-suite archives
        uses: actions/upload-artifact@v4
        with:
          name: release-tool-archives
          path: artifacts/tools/*
          if-no-files-found: error
          retention-days: 7

  smoke-tool-archives:
    needs: [metadata, validate, tool-archives]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: release-tool-archives
          path: artifacts/tools

      - name: Smoke matching tool-suite archive
        shell: pwsh
        run: ./.github/scripts/smoke-tool-archive.ps1 artifacts/tools

  smoke-tool-package:
    needs: [metadata, validate]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts

      - name: Smoke installable Icod.TermInfo.Tools package
        shell: pwsh
        run: ./.github/scripts/smoke-tool-package.ps1 artifacts

  publish-nuget:
    needs: [metadata, validate, tool-archives, smoke-tool-archives, smoke-tool-package]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/package

      - name: Exchange GitHub OIDC token for NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $packages = @(
              "artifacts/package/Icod.TermInfo.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Source.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Compiler.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Inspection.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Tools.$version.nupkg"
          )

          foreach ($package in $packages) {
              if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
                  throw "Expected package '$package' was not downloaded."
              }

              dotnet nuget push $package `
                  --api-key $env:NUGET_API_KEY `
                  --source 'https://api.nuget.org/v3/index.json' `
                  --skip-duplicate
              if (0 -ne $LASTEXITCODE) {
                  throw "NuGet.org publication failed for '$package' with status $LASTEXITCODE."
              }
          }

  publish-github-packages:
    needs: [metadata, validate, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/package

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          dotnet nuget add source $source `
              --name github-release `
              --username $env:GITHUB_ACTOR_NAME `
              --password $env:GITHUB_TOKEN `
              --store-password-in-clear-text
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Packages source configuration failed with status $LASTEXITCODE."
          }

          $version = '${{ needs.metadata.outputs.version }}'
          $packages = @(
              "artifacts/package/Icod.TermInfo.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Source.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Compiler.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Inspection.$version.nupkg",
              "artifacts/package/Icod.TermInfo.Tools.$version.nupkg"
          )

          foreach ($package in $packages) {
              if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
                  throw "Expected package '$package' was not downloaded."
              }

              dotnet nuget push $package `
                  --source github-release `
                  --api-key $env:GITHUB_TOKEN `
                  --skip-duplicate
              if (0 -ne $LASTEXITCODE) {
                  throw "GitHub Packages publication failed for '$package' with status $LASTEXITCODE."
              }
          }

  github-release:
    needs: [metadata, validate, tool-archives, publish-nuget, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/release-assets

      - uses: actions/download-artifact@v4
        with:
          name: release-tool-archives
          path: artifacts/release-assets

      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(
              Get-ChildItem -LiteralPath $assetDirectory -File |
                  Where-Object { $_.Extension -in @('.nupkg', '.snupkg', '.zip', '.gz') } |
                  Sort-Object Name
          )
          if (15 -ne $files.Count) {
              throw "Expected nine package artifacts and six tool archives before checksumming; found $($files.Count)."
          }

          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
              (Join-Path $assetDirectory 'SHA256SUMS.txt'),
              $lines,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ needs.metadata.outputs.version }}'
          $assetDirectory = [System.IO.Path]::GetFullPath('artifacts/release-assets')
          $notes = @'
          ## Installation

          ```text
          dotnet add package Icod.TermInfo --version {0}
          dotnet add package Icod.TermInfo.Source --version {0}
          dotnet add package Icod.TermInfo.Compiler --version {0}
          dotnet add package Icod.TermInfo.Inspection --version {0}
          dotnet tool install --global Icod.TermInfo.Tools --version {0}
          ```

          The installed tool exposes `icod-terminfo tic`, `icod-terminfo infocmp`,
          and `icod-terminfo toe`. The attached standalone archives continue to
          expose the traditional `tic`, `infocmp`, and `toe` command names.

          `Icod.TermInfo`, `Icod.TermInfo.Source`, `Icod.TermInfo.Compiler`, and
          `Icod.TermInfo.Inspection` target `net8.0`, `net9.0`, and `net10.0`.
          Source depends on the matching Runtime package. Compiler and Inspection
          each depend on the matching Runtime and Source packages; Inspection does
          not depend on Compiler.

          The framework-dependent .NET 10 tool suite is also attached for
          win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, and osx-arm64.
          Each tool archive contains `tic`, `infocmp`, and `toe` plus required
          managed dependencies; the user supplies the .NET 10 runtime.

          All five NuGet packages, the four reusable-library symbol packages,
          all six tool-suite archives, and SHA-256 checksums are attached to this
          release.
          '@ -f $version

          $assets = @(
              Get-ChildItem -LiteralPath $assetDirectory -File |
                  Where-Object { $_.Extension -in @('.nupkg', '.snupkg', '.zip', '.gz', '.txt') } |
                  Sort-Object Name |
                  ForEach-Object { $_.FullName }
          )
          if (16 -ne $assets.Count) {
              throw "Expected sixteen GitHub Release assets; found $($assets.Count)."
          }

          $arguments = @(
              'release', 'create', $tag,
              '--verify-tag',
              '--title', "Icod.TermInfo $version",
              '--generate-notes',
              '--notes', $notes
          )
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets

          & gh @arguments
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Release creation failed with status $LASTEXITCODE."
          }
