name: rb01-contract-correction

on:
  push:
    branches:
      - 1.14.0

permissions:
  contents: write

jobs:
  correct-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.14.0
          fetch-depth: 0
      - name: Apply nullable placement-request correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path

          roadmap_path = Path('Icod.TermInfo-1.14.0-Raster-Backend-Capability-Evidence-Selection-and-Planning-Roadmap.md')
          spec_path = Path('docs/superpowers/specs/2026-09-14-1.14.0-raster-backend-evidence-selection-design.md')

          roadmap = roadmap_path.read_text(encoding='utf-8')
          spec = spec_path.read_text(encoding='utf-8')

          roadmap_old = '''The 1.14 request SHALL compose existing request types:

```text
PersistentRasterLifecycleRequest
PersistentRasterPlacementRequest
```

1.14 SHALL NOT duplicate their semantic fields.'''
          roadmap_new = '''The 1.14 request SHALL compose existing request types:

```text
PersistentRasterLifecycleRequest
PersistentRasterPlacementRequest?
```

`PlacementRequest = null` means no advanced 1.12 placement semantics are requested. This is required because the frozen `PersistentRasterPlacementRequest` intentionally rejects an empty request.

1.14 SHALL NOT duplicate their semantic fields.'''
          if roadmap_old not in roadmap:
              raise SystemExit('roadmap selection-request anchor not found')
          roadmap = roadmap.replace(roadmap_old, roadmap_new, 1)

          roadmap_algorithm_old = '''6. lifecycle `Indeterminate` -> candidate `RequiresRuntimeVerification`;
7. lifecycle `Success` -> call the existing placement planner;
8. placement `Impossible` -> candidate `Impossible`;
9. placement `RequiresRuntimeVerification` or `Indeterminate` -> candidate `RequiresRuntimeVerification`; and
10. placement `Satisfied` -> candidate `Satisfied`.'''
          roadmap_algorithm_new = '''6. lifecycle `Indeterminate` -> candidate `RequiresRuntimeVerification`;
7. lifecycle `Success` with no placement request -> candidate `Satisfied`;
8. lifecycle `Success` with a placement request -> call the existing placement planner;
9. placement `Impossible` -> candidate `Impossible`;
10. placement `RequiresRuntimeVerification` or `Indeterminate` -> candidate `RequiresRuntimeVerification`; and
11. placement `Satisfied` -> candidate `Satisfied`.'''
          if roadmap_algorithm_old not in roadmap:
              raise SystemExit('roadmap candidate algorithm anchor not found')
          roadmap = roadmap.replace(roadmap_algorithm_old, roadmap_algorithm_new, 1)

          spec_old = '''RasterBackendSelectionRequest
    LifecycleRequest : PersistentRasterLifecycleRequest
    PlacementRequest : PersistentRasterPlacementRequest
```

Selecting a raster backend always requires the backend itself to be supported. Lifecycle and placement requirements are evaluated by the existing planners.'''
          spec_new = '''RasterBackendSelectionRequest
    LifecycleRequest : PersistentRasterLifecycleRequest
    PlacementRequest : PersistentRasterPlacementRequest?
```

`PlacementRequest = null` means the caller requests no advanced 1.12 placement semantics. This preserves valid lifecycle-only selection requests because the frozen `PersistentRasterPlacementRequest` intentionally rejects an empty request.

Selecting a raster backend always requires the backend itself to be supported. Lifecycle requirements are always evaluated by the existing planner; placement requirements are evaluated by the existing placement planner only when `PlacementRequest` is non-null.'''
          if spec_old not in spec:
              raise SystemExit('spec selection-request anchor not found')
          spec = spec.replace(spec_old, spec_new, 1)

          spec_mapping_old = '''- lifecycle `Indeterminate` -> `RequiresRuntimeVerification`;
- lifecycle `Success` continues into the frozen placement planner;
- placement `Impossible` -> `Impossible`;
- placement `RequiresRuntimeVerification` or `Indeterminate` -> `RequiresRuntimeVerification`;
- placement `Satisfied` -> `Satisfied`.'''
          spec_mapping_new = '''- lifecycle `Indeterminate` -> `RequiresRuntimeVerification`;
- lifecycle `Success` with `PlacementRequest = null` -> `Satisfied`;
- lifecycle `Success` with a non-null placement request continues into the frozen placement planner;
- placement `Impossible` -> `Impossible`;
- placement `RequiresRuntimeVerification` or `Indeterminate` -> `RequiresRuntimeVerification`;
- placement `Satisfied` -> `Satisfied`.'''
          if spec_mapping_old not in spec:
              raise SystemExit('spec candidate mapping anchor not found')
          spec = spec.replace(spec_mapping_old, spec_mapping_new, 1)

          roadmap_path.write_text(roadmap, encoding='utf-8', newline='\n')
          spec_path.write_text(spec, encoding='utf-8', newline='\n')
          '@
          Set-Content -LiteralPath rb01-contract-correction.py -Value $script -Encoding utf8
          python rb01-contract-correction.py
          Remove-Item rb01-contract-correction.py
      - name: Remove temporary workflow and commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rb01-contract-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Icod.TermInfo-1.14.0-Raster-Backend-Capability-Evidence-Selection-and-Planning-Roadmap.md docs/superpowers/specs/2026-09-14-1.14.0-raster-backend-evidence-selection-design.md .github/workflows/rb01-contract-correction.yml
          git diff --cached --check
          git commit -m 'Correct RB01 lifecycle-only selection contract'
          git push origin HEAD:1.14.0
