name: da08-closure

on:
  push:
    branches: [1.10.0]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0
      - name: Apply DA08 closure
        run: python3 .github/scripts/da08-closure.py
      - name: Commit DA08 closure
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props README.md Icod.TermInfo.Inspection/README.md Icod.TermInfo.Inspection/Icod.TermInfo.Inspection.csproj icod-terminfo/Icod.TermInfo.Router.csproj toe/README.md infocmp/README.md docs/COMPATIBILITY.md docs/VERSIONING.md Icod.TermInfo-1.10.0-Deterministic-Multi-Database-Inspection-Comparison-and-Planning-Automation-Roadmap.md tests/Icod.TermInfo.Tests/src/T45CompletionGateTests.cs tests/Icod.TermInfo.Termcap.Tests/src/TC08ContractTests.cs tests/Icod.TermInfo.Inspection.Tests/src/RP08ReleaseClosureTests.cs tests/Icod.TermInfo.Inspection.Tests/src/RS08ContractTests.cs tests/Icod.TermInfo.Tic.Tests/src/ReleaseClosureTests.cs tests/Icod.TermInfo.Tic.Tests/src/CommandTests.cs tests/Icod.TermInfo.InfoCmp.Tests/src/CommandTests.cs tests/Icod.TermInfo.Toe.Tests/src/CommandTests.cs tests/Icod.TermInfo.Router.Tests/src/ContractTests.cs tests/Icod.TermInfo.Router.Tests/src/CommandTests.cs
          git commit -m 'Complete DA08 release closure'
          git push origin HEAD:1.10.0
