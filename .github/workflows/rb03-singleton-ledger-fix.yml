name: rb03-singleton-ledger-fix

on:
  push:
    branches:
      - 1.14.0
    paths:
      - .github/workflows/rb03-singleton-ledger-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.14.0
          fetch-depth: 0

      - name: Preserve approved-type HashSet cardinality
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/verify-inspection-compatibility.ps1')
          text = path.read_text(encoding='utf-8')
          old = '''    return $approved\n}\n\nfunction Remove-ApprovedTypes {'''
          new = '''    # PowerShell enumerates collection return values. Preserve the HashSet as\n    # one object so a one-entry tranche ledger does not collapse to a scalar.\n    Write-Output -NoEnumerate $approved\n}\n\nfunction Remove-ApprovedTypes {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Read-ApprovedTypes return site, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/rb03-singleton-ledger-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve singleton compatibility ledgers"
          git push origin HEAD:1.14.0
