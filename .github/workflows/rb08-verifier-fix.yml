name: rb08-verifier-fix

on:
  push:
    branches:
      - 1.14.0
    paths:
      - .github/workflows/rb08-verifier-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.14.0
          fetch-depth: 0
      - name: Patch compatibility verifier and remove temporary helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/verify-inspection-compatibility.ps1')
          s = p.read_text(encoding='utf-8')
          old = "$freezePath = Join-Path $repositoryRoot 'docs/1.13.0-INSPECTION-PUBLIC-API-FREEZE.md'"
          assert s.count(old) == 1
          s = s.replace(old, "\n".join(["$oneThirteenFreezePath = Join-Path $repositoryRoot 'docs/1.13.0-INSPECTION-PUBLIC-API-FREEZE.md'", "$oneFourteenFreezePath = Join-Path $repositoryRoot 'docs/1.14.0-INSPECTION-PUBLIC-API-FREEZE.md'"]), 1)
          s = s.replace('$freezePath', '$oneThirteenFreezePath')
          old = "$oneThirteenApiSha256 = 'fd827a25abafb8e9ff3915567f45f9f2ec51b332bfd8a82dd4e4bca20290e764'"
          assert s.count(old) == 1
          s = s.replace(old, old + "\n$oneFourteenApiSha256 = 'e9f240a562aec5274d64fb2ec3647862fe4ef5684582af2b442ba3c55e189497'", 1)
          old = "    $oneThirteenFreezePath,\n    $oneFourteenRb01TypesPath,"
          assert s.count(old) == 1
          s = s.replace(old, "    $oneThirteenFreezePath,\n    $oneFourteenFreezePath,\n    $oneFourteenRb01TypesPath,", 1)
          marker = "        $approvedRb01Types = Read-ApprovedTypes `"
          assert s.count(marker) == 1
          block = "\n".join(["        $currentOneFourteenSha256 = Get-NormalizedSha256 -Text $current", "        if (-not [string]::Equals(", "            $oneFourteenApiSha256,", "            $currentOneFourteenSha256,", "            [System.StringComparison]::Ordinal", "        )) {", "            throw \"Icod.TermInfo.Inspection whole 1.14 public API fingerprint changed. Expected $oneFourteenApiSha256, actual $currentOneFourteenSha256.\"", "        }", "", "        $oneFourteenFreeze = [System.IO.File]::ReadAllText($oneFourteenFreezePath)", "        if ($oneFourteenFreeze.IndexOf($oneFourteenApiSha256, [System.StringComparison]::Ordinal) -lt 0) {", "            throw '1.14.0-INSPECTION-PUBLIC-API-FREEZE.md does not record the expected whole-surface fingerprint.'", "        }", "", "        Write-Host \"Verified exact 1.14 Inspection public API SHA-256 $currentOneFourteenSha256.\"", ""])
          s = s.replace(marker, block + "\n" + marker, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          for helper in ['.github/workflows/rb08-closure-foundation.yml', '.github/workflows/rb08-verifier-fix.yml']:
              hp = Path(helper)
              if hp.exists():
                  hp.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze whole 1.14 Inspection compatibility surface'
          git push origin HEAD:1.14.0
