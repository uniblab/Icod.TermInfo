name: Apply focused 1.9.0 warning fixes

on:
  push:
    branches:
      - fix_1.9.0_build_warnings
    paths:
      - .github/workflows/apply-fix-1.9.0-warnings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix_1.9.0_build_warnings

      - name: Apply fixes
        run: python3 .github/scripts/fix-1.9.0-build-warnings.py

      - name: Commit fixes
        run: |
          rm .github/scripts/fix-1.9.0-build-warnings.py
          rm .github/workflows/apply-fix-1.9.0-warnings.yml
          rm -f .github/workflows/fix-1.9.0-build-warnings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix 1.9.0 build warnings"
          git push origin HEAD:fix_1.9.0_build_warnings
