name: consumer-doc-links

on:
  push:
    branches: [1.10.0]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0
      - name: Update consumer documentation links
        run: python3 .github/scripts/consumer-doc-links.py
      - name: Commit consumer documentation links
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Icod.TermInfo.Inspection/README.md
          git commit -m 'Link 1.10 consumer guide and database-set sample'
          git push origin HEAD:1.10.0
