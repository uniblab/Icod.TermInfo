name: Finalize DA06 parser formatting

on:
  push:
    branches:
      - 1.10.0
    paths:
      - .github/workflows/da06-indent.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Correct DA06 parser formatting
        run: python3 .github/scripts/da06-indent.py

      - name: Build formatted DA06 with zero warnings
        run: |
          set -o pipefail
          dotnet build Icod.TermInfo.sln -c Debug 2>&1 | tee da06-indent-build.log
          grep -q "0 Warning(s)" da06-indent-build.log
          grep -q "0 Error(s)" da06-indent-build.log

      - name: Test formatted DA06
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build

      - name: Commit formatted DA06
        run: |
          rm .github/scripts/da06-indent.py
          rm .github/workflows/da06-indent.yml
          rm -f da06-indent-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize DA06 parser formatting"
          git push origin HEAD:1.10.0
