name: Clean DA06 parser composition

on:
  push:
    branches:
      - 1.10.0
    paths:
      - .github/workflows/da06-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Clean DA06 parser composition
        run: python3 .github/scripts/da06-cleanup.py

      - name: Build cleaned DA06 with zero warnings
        run: |
          set -o pipefail
          dotnet build Icod.TermInfo.sln -c Debug 2>&1 | tee da06-cleanup-build.log
          grep -q "0 Warning(s)" da06-cleanup-build.log
          grep -q "0 Error(s)" da06-cleanup-build.log

      - name: Test cleaned DA06
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build

      - name: Commit cleaned DA06
        run: |
          rm .github/scripts/da06-cleanup.py
          rm .github/workflows/da06-cleanup.yml
          rm -f da06-cleanup-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up DA06 parser composition"
          git push origin HEAD:1.10.0
