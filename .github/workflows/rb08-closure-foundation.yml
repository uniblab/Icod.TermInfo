## Adversarial coverage

RB08 closes the release by relying on permanent tranche-owned tests rather than duplicating them: RB01 owns enum/bounds/provenance/duplicate preference validation; RB02 owns evidence precedence, contradictions, permutation/culture behavior, conservative Sixel inspection, and anti-brand-heuristic cases; RB04 owns duplicate candidates, complete-preference enforcement, input permutations, no-preference ambiguity, verification blockers, impossible fallback, and all-impossible selection; RB05 owns runtime-integration composition; RB06 owns exact JSON shapes, repeatability, culture independence, cancellation, and exact UTF-8 byte bounds; RB07 owns package-only all-TFM interoperability and the production dependency boundary. RB08 additionally locks the whole API and all schema fingerprints together.

## Dependency and distribution boundary

Production `Icod.TermInfo.Inspection` does not reference `Icod.Terminal`. The package-only RB07 consumer and focused sample pin published `Icod.Terminal 1.13.0` and keep mapping policy outside TermInfo. The normal PR matrix validates Windows, Linux, macOS, exact Staging packages, isolated consumers, installed-tool smokes, and all six archive RIDs.

