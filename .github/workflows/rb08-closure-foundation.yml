          Path('docs/1.14.0-INSPECTION-PUBLIC-API-FREEZE.md').write_text(r'''# Icod.TermInfo 1.14.0 Inspection Public API Freeze

## Exact surface identity

The complete `Icod.TermInfo.Inspection` 1.14 public reflection manifest is frozen by normalized-LF SHA-256:

```text
e9f240a562aec5274d64fb2ec3647862fe4ef5684582af2b442ba3c55e189497
```

The manifest uses `Icod.TermInfo.PublicApiSnapshot/v1`, retains assembly version `1.0.0.0`, and contains exactly **106 exported public types**. The fingerprint was derived from the exact `1.14.0-Alpha-8` Staging package/API artifact produced by head `57cf05576466f599cd1c1819105b7e7b90c274f2` in workflow #915 / run `34902088356`, which passed all 12 jobs before RB08 added release-facing closure authorities.

RB08 release verification first generates the complete manifest from every candidate assembly and rejects a normalized fingerprint other than the value above.

## Compatibility decomposition

The 1.14 surface is strictly additive above the frozen 1.13 Inspection contract:

1. the complete 1.13 Inspection manifest remains frozen by normalized-LF SHA-256 `fd827a25abafb8e9ff3915567f45f9f2ec51b332bfd8a82dd4e4bca20290e764`;
2. RB01 contributes exactly 13 reviewed `RasterBackend*` public type blocks;
3. RB02 contributes exactly 2 reviewed `RasterBackend*` public type blocks;
4. RB03 contributes exactly 1 reviewed `RasterBackend*` public type block;
5. RB04 and RB05 add behavior to the already-reviewed types without introducing another public type;
6. RB06 contributes exactly 6 reviewed additive `TermInfoJsonRenderer` member lines for JSON v6; and
7. RB07 and RB08 add no production public API.

Release verification therefore proves the complete 1.14 surface first. It then removes exactly the 16 RB01/RB02/RB03 type blocks and the 6 RB06 renderer members and requires the result to reproduce the frozen 1.13 SHA-256 exactly. The established 1.13 -> 1.12 -> 1.11 -> 1.10 historical reconstruction chain then runs unchanged.

An accidental change to an earlier member, an approved 1.14 addition, or an unreviewed new public member fails the release gate.

## Cross-target equality

The package targets `net8.0`, `net9.0`, and `net10.0`. Package verification requires equivalent public API manifests on all three TFMs; no target framework owns a divergent 1.14 surface.

## Dependency boundary

Production `Icod.TermInfo.Inspection` remains free of `Icod.Terminal`. RB07 qualifies caller-owned adaptation against published `Icod.Terminal 1.13.0` only in package-consumer and sample code. TermInfo does not perform live Sixel or Kitty Graphics protocol I/O, allocate terminal-side identities, or own graphics transport policy.

## Machine-readable contract

The public API freeze is independent from the JSON schema freeze. Exact normalized-LF fingerprints for versions 1 through 6 are recorded in `docs/1.14.0-RB08-FREEZE-FINGERPRINTS.txt`. Versions 1 through 5 remain immutable historical contracts. JSON v6 contains exactly the 1.14 raster-backend document kinds:

```text
rasterBackendProfile
rasterBackendSelectionPlan
```
''', encoding='utf-8', newline='\n')

