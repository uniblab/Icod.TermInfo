## Exact API freeze

The complete `Icod.TermInfo.Inspection` 1.14 reflection manifest contains **106 exported public types** and has normalized-LF SHA-256:

```text
e9f240a562aec5274d64fb2ec3647862fe4ef5684582af2b442ba3c55e189497
```

RB01/RB02/RB03 contribute exactly 16 reviewed `RasterBackend*` public type blocks. RB06 contributes exactly six reviewed additive `TermInfoJsonRenderer` member lines. Removing those exact 1.14 additions reconstructs the frozen 1.13 surface with SHA-256 `fd827a25abafb8e9ff3915567f45f9f2ec51b332bfd8a82dd4e4bca20290e764`, after which the established historical reconstruction continues through 1.10.

## JSON schema freeze

