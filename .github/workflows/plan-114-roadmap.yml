name: plan-114-roadmap

on:
  push:
    branches:
      - 1.14.0

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.14.0
      - name: Update authoritative roadmap
        run: python .github/scripts/plan-114-roadmap.py
      - name: Commit roadmap and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/plan-114-roadmap.py
          rm .github/workflows/plan-114-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Icod.TermInfo-Post-1.0-Development-Roadmap.md .github/scripts/plan-114-roadmap.py .github/workflows/plan-114-roadmap.yml
          git diff --cached --check
          git commit -m "Update long-range roadmap for Icod.TermInfo 1.14.0"
          git push origin HEAD:1.14.0
