name: re08-readme-polish

on:
  push:
    branches:
      - 1.13.0

permissions:
  contents: write

jobs:
  polish-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.13.0
          fetch-depth: 0
      - name: Apply exact README polish
        run: python .github/scripts/re08-readme-polish.py
      - name: Commit polish and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md samples/Icod.TermInfo.PersistentRasterLifecycle.Sample/README.md samples/Icod.TermInfo.PersistentRasterPlacement.Sample/README.md samples/Icod.TermInfo.PersistentRasterRuntimeIntegration.Sample/README.md
          git rm .github/scripts/re08-readme-polish.py .github/workflows/re08-readme-polish.yml
          git diff --cached --check
          git commit -m "Polish 1.13 sample and README documentation"
          git push origin HEAD:1.13.0
