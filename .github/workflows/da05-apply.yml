name: Apply DA05 multi-database planning

on:
  push:
    branches:
      - 1.10.0
    paths:
      - .github/workflows/da05-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Apply DA05 coordinated updates
        run: python3 .github/scripts/da05-apply.py

      - name: Build DA05
        run: dotnet build Icod.TermInfo.sln -c Debug

      - name: Test DA05
        run: dotnet test Icod.TermInfo.sln -c Debug --no-build

      - name: Commit DA05
        run: |
          rm .github/scripts/da05-apply.py
          rm .github/workflows/da05-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement DA05 multi-database planning"
          git push origin HEAD:1.10.0
